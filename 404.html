<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Disc-Tools</title>
    <meta name="description" content="This tool got rate-limited by existence.">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            text-align: center;
            gap: 12px;
        }
        .error-icon {
            font-size: 48px;
            color: var(--accent2);
            opacity: .6;
        }
        .error-tag {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent2);
            font-family: var(--mono, monospace);
        }
        h1 {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 900;
            margin: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        p {
            color: var(--muted);
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.6;
            max-width: 480px;
            margin: 0;
        }
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            transition: all .2s;
            margin-top: 8px;
        }
        .error-btn:hover {
            background: var(--accent2);
            transform: translateY(-2px);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script defer src="https://umami.disc-tools.de/script.js" data-website-id="0cf82497-80c8-42a2-b6e4-8a8ae179d1fe"></script>
</head>
<body>
    <div class="glow"></div>
    <div class="error-icon"><i class="fa-solid fa-wrench"></i></div>
    <div class="error-tag">// 404</div>
    <h1>404</h1>
    <p>This tool either doesn't exist yet<br>or got rate-limited by existence.</p>
    <a href="/" class="error-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</body>
</html>
