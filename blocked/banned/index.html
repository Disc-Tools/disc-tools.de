<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | Disc-Tools</title>
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css?v=2">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            margin: 0;
            padding: 20px;
        }
        .banned-container {
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.3s ease forwards;
        }
        .banned-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 36px 36px;
            text-align: center;
        }
        .banned-icon {
            width: 72px;
            height: 72px;
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 24px;
        }
        .banned-card h1 {
            font-family: var(--sans);
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 12px;
            color: #fff;
        }
        .banned-card p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 28px;
        }
        .banned-btn {
            display: block;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: 700;
            font-family: var(--sans);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            border: none;
        }
        .banned-btn-primary {
            background: #e74c3c;
            color: #fff;
        }
        .banned-btn-primary:hover {
            background: #c0392b;
            transform: translateY(-1px);
        }
    </style>
    <link rel="canonical" href="https://disc-tools.de">
    <meta property="og:title" content="Access Denied | Disc-Tools">
    <meta property="og:description" content="Account suspended.">
    <meta property="og:image" content="https://disc-tools.de/assets/img/logo.png">
</head>
<body>
    <div class="glow"></div>
    <div class="banned-container">
        <div class="banned-card">
            <div class="banned-icon"><i class="fa-solid fa-hand"></i></div>
            <h1>Access Denied</h1>
            <p>Your account has been suspended. If you believe this is a mistake, contact us on our Discord server.</p>
            <a href="https://discord.gg/rtRs8rhj5u" class="banned-btn banned-btn-primary"><i class="fa-brands fa-discord"></i> Contact Support</a>
        </div>
    </div>
</body>
</html>
