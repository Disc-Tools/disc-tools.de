<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Access Restricted · Disc-Tools</title>
    <link rel="icon" href="/static/assets/img/logo.svg?v=20261116-live1" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/site.css?v=20261116-live1">
    <link rel="stylesheet" href="/static/css/errors.css?v=20261116-live1">
    <script src="/static/js/blocked-vpn.js?v=20261116-live1" defer></script>
</head>
<body>
    <header class="error-header">
        <div class="container error-header-inner">
            <a class="brand" href="/"><img src="/static/assets/img/logo.svg?v=20261116-live1" width="32" height="32" alt="">Disc-Tools</a>
            <a class="error-status-link" href="https://status.disc-tools.de/#cat-main-site">Service status</a>
        </div>
    </header>
    <main class="container error-page">
        <div>
            <h1>Access restricted</h1>
            <p class="error-message">Our security system detected a VPN, proxy, or hosting connection. Access is restricted for these connection types.</p>
            <dl class="error-details">
                <div><dt>IP address</dt><dd data-connection-detail="ip">—</dd></div>
                <div><dt>Type</dt><dd data-connection-detail="type">—</dd></div>
                <div><dt>Provider</dt><dd data-connection-detail="provider">—</dd></div>
                <div><dt>ASN</dt><dd data-connection-detail="asn">—</dd></div>
            </dl>
            <a class="button button-primary" href="/">Retry</a>
        </div>
        <nav class="error-links" aria-label="Account and support">
            <a href="https://disc-tools.de/api/auth/login?redirect=/success/login/">Log in with Discord <span aria-hidden="true">→</span></a>
            <a href="https://discord.gg/rtRs8rhj5u">Contact support <span aria-hidden="true">→</span></a>
        </nav>
    </main>
</body>
</html>
