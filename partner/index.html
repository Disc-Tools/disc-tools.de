<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partnership | Disc-Tools</title>
    <meta name="description" content="Join our partnership program and grow together with Disc-Tools">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <link rel="stylesheet" href="/css/style.css?v=2">
    <style>
        .partners-header {
            text-align: center;
            margin: 40px 0 60px;
        }
        .partners-header h1 {
            font-size: 48px;
            margin: 0 0 15px;
            background: linear-gradient(135deg, var(--accent), #7c8ff5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .partners-header p {
            color: var(--muted);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .partners-cta {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: var(--accent);
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .partners-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(88, 101, 242, 0.3);
        }
        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 60px 0;
        }
        .partner-card {
            background: rgba(21, 25, 33, 0.6);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            gap: 15px;
            cursor: pointer;
        }
        .partner-card:hover {
            transform: translateY(-5px);
            border-color: rgba(88, 101, 242, 0.5);
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.1);
        }
        .partner-logo {
            width: 60px;
            height: 60px;
            background: var(--surface);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .partner-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        .partner-info h3 {
            margin: 0;
            font-size: 18px;
            color: white;
        }
        .partner-info p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            flex-grow: 1;
        }
        .partner-actions {
            display: flex;
            gap: 10px;
        }
        .partner-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            background: rgba(88, 101, 242, 0.1);
            color: var(--accent);
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(88, 101, 242, 0.2);
            transition: all 0.2s;
            flex: 1;
            text-align: center;
            justify-content: center;
        }
        .partner-link:hover {
            background: var(--accent);
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-icon {
            font-size: 48px;
            color: var(--muted);
            margin-bottom: 15px;
        }

        .partner-detail {
            max-width: 700px;
            margin: 40px auto;
        }
        .partner-detail-card {
            background: rgba(21, 25, 33, 0.6);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 50px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .partner-detail-logo {
            width: 120px;
            height: 120px;
            background: var(--surface);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            border: 1px solid var(--border);
            margin: 0 auto 25px;
            overflow: hidden;
        }
        .partner-detail-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .partner-detail-card h1 {
            font-size: 32px;
            margin: 0 0 15px;
        }
        .partner-detail-card p {
            color: var(--muted);
            line-height: 1.7;
            font-size: 15px;
            margin: 0 0 30px;
        }
        .partner-detail-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .partner-detail-actions .partner-link {
            font-size: 14px;
            padding: 12px 25px;
            flex: 0 1 auto;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: white;
        }

        .partner-edit-section {
            max-width: 600px;
            margin: 40px auto;
            display: none;
        }
        .partner-edit-section.visible {
            display: block;
        }
        .edit-card {
            background: rgba(21, 25, 33, 0.6);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 35px;
            backdrop-filter: blur(10px);
        }
        .edit-card h2 {
            margin: 0 0 25px;
            font-size: 22px;
            text-align: center;
        }
        .edit-card .form-group {
            margin-bottom: 20px;
        }
        .edit-card .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        .edit-card .form-group input,
        .edit-card .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-family: var(--sans);
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .edit-card .form-group input:focus,
        .edit-card .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .edit-card .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .btn-save {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3);
        }
        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .save-feedback {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        .save-feedback.success { color: #2ecc71; }
        .save-feedback.error { color: #e74c3c; }

        @media (max-width: 768px) {
            .partners-header h1 { font-size: 36px; }
            .partners-grid { grid-template-columns: 1fr; }
            .partner-detail-card { padding: 30px 20px; }
            .partner-detail-card h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <header>
        <a href="/" class="logo-container">
            <img loading="lazy" src="/assets/img/logo.png" alt="Disc-Tools Logo" class="main-logo" onerror="this.style.display='none'">
            <div class="logo">Disc<span>-</span>Tools</div>
        </a>
        <nav class="nav-links">
            <a href="/tools/" class="nav-link">Tools</a>
            <a href="/guides/" class="nav-link">Guides</a>
            <a href="https://status.disc-tools.de/status/disc-tools" class="nav-link">Status</a>
            <a href="/partner/" class="nav-link active">Partner</a>
        </nav>
        <button class="menu-toggle" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <span class="login-badge"></span>
    </header>

    <nav class="breadcrumbs" id="breadcrumbs">
        <a href="/">Home</a>
        <span>/</span>
        <a href="/partner/" id="breadcrumb-partner">Partner</a>
    </nav>

    <main class="tool-page container" style="margin-top: 0;">
        <div id="listingView">
            <div class="partners-header">
                <h1>Our Partners</h1>
                <p>Join a network of innovative projects and services working together to enhance the Discord ecosystem</p>
                <a href="/partner/request/" class="partners-cta"><i class="fa-solid fa-handshake"></i> Become a Partner</a>
            </div>
            <div id="partnersContainer" class="partners-grid"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon"><i class="fa-solid fa-star"></i></div>
                <h3>No Active Partners Yet</h3>
                <p style="color: var(--muted); margin-top: 10px;">Be the first to join our partnership program!</p>
            </div>
        </div>

        <div id="detailView" style="display: none;">
            <a href="/partner/" class="back-link" id="backToList"><i class="fa-solid fa-arrow-left"></i> All Partners</a>
            <div class="partner-detail">
                <div class="partner-detail-card" id="partnerDetailCard"></div>
            </div>
        </div>

        <div id="editView" class="partner-edit-section">
            <div class="edit-card">
                <h2><i class="fa-solid fa-pen-to-square"></i> Edit Your Partner Page</h2>
                <form id="partnerEditForm">
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" id="edit-description" placeholder="Tell visitors about your project..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Website URL</label>
                        <input type="url" name="website" id="edit-website" placeholder="https://yoursite.com">
                    </div>
                    <div class="form-group">
                        <label>Discord Invite</label>
                        <input type="url" name="discord_server" id="edit-discord" placeholder="https://discord.gg/...">
                    </div>
                    <div class="form-group">
                        <label>Logo URL</label>
                        <input type="url" name="logo" id="edit-logo" placeholder="https://example.com/logo.png">
                    </div>
                    <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                    <div class="save-feedback" id="saveFeedback"></div>
                </form>
            </div>
        </div>
    </main>

    <script src="/js/umami-tracking.js"></script>
    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const slug = window.location.pathname.replace('/partner/', '').replace(/\/$/, '');

        async function loadPartners() {
            try {
                const response = await fetch('/api/partners');
                const partners = await response.json();

                const container = document.getElementById('partnersContainer');
                const emptyState = document.getElementById('emptyState');

                if (partners.length === 0) {
                    emptyState.style.display = 'block';
                    container.style.display = 'none';
                    return;
                }

                container.innerHTML = partners.map(partner => `
                    <div class="partner-card" data-slug="${escapeHtml(partner.slug)}">
                        <div style="display: flex; gap: 15px; align-items: flex-start;">
                            <div class="partner-logo">
                                ${partner.logo ? `<img src="${escapeHtml(partner.logo)}" alt="${escapeHtml(partner.name)}">` : '<i class="fa-solid fa-building"></i>'}
                            </div>
                            <div class="partner-info">
                                <h3>${escapeHtml(partner.name)}</h3>
                            </div>
                        </div>
                        <p>${escapeHtml(partner.description || '')}</p>
                        <div class="partner-actions">
                            ${partner.website ? `<a href="${escapeHtml(partner.website)}" target="_blank" rel="noopener noreferrer" class="partner-link"><i class="fa-solid fa-globe"></i> Website</a>` : ''}
                            ${partner.discordServer ? `<a href="${escapeHtml(partner.discordServer)}" target="_blank" rel="noopener noreferrer" class="partner-link"><i class="fa-brands fa-discord"></i> Discord</a>` : ''}
                        </div>
                    </div>
                `).join('');

                container.querySelectorAll('.partner-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('.partner-actions')) return;
                        const slug = this.getAttribute('data-slug');
                        if (slug) window.location = '/partner/' + slug;
                    });
                });

                trackEvent('page_view', { page: 'partners' });
            } catch (error) {
                console.error('Failed to load partners:', error);
            }
        }

        async function loadPartnerDetail(slug) {
            try {
                const response = await fetch(`/api/partner/${slug}`);
                if (!response.ok) {
                    document.getElementById('listingView').style.display = 'block';
                    return;
                }
                const partner = await response.json();

                document.getElementById('listingView').style.display = 'none';
                document.getElementById('detailView').style.display = 'block';

                document.getElementById('breadcrumb-partner').textContent = partner.name;
                document.getElementById('breadcrumb-partner').href = `/partner/${partner.slug}`;

                document.getElementById('partnerDetailCard').innerHTML = `
                    <div class="partner-detail-logo">
                        ${partner.logo ? `<img src="${escapeHtml(partner.logo)}" alt="${escapeHtml(partner.name)}">` : '<i class="fa-solid fa-building"></i>'}
                    </div>
                    <h1>${escapeHtml(partner.name)}</h1>
                    <p>${escapeHtml(partner.description || '')}</p>
                    <div class="partner-detail-actions">
                        ${partner.website ? `<a href="${escapeHtml(partner.website)}" target="_blank" rel="noopener noreferrer" class="partner-link"><i class="fa-solid fa-globe"></i> Website</a>` : ''}
                        ${partner.discordServer ? `<a href="${escapeHtml(partner.discordServer)}" target="_blank" rel="noopener noreferrer" class="partner-link"><i class="fa-brands fa-discord"></i> Discord</a>` : ''}
                    </div>
                `;

                document.title = `${partner.name} | Disc-Tools Partners`;
            } catch (error) {
                console.error('Failed to load partner:', error);
                document.getElementById('listingView').style.display = 'block';
            }
        }

        if (slug && slug !== '') {
            loadPartnerDetail(slug);
            checkOwnPartner(slug);
        } else {
            loadPartners();
        }

        async function checkOwnPartner(slug) {
            try {
                const authRes = await fetch('/api/auth/me');
                const auth = await authRes.json();
                if (!auth.authenticated) return;

                let partnerData = null;
                let isAdmin = false;

                try {
                    const adminRes = await fetch('/api/admin/check');
                    const adminData = await adminRes.json();
                    isAdmin = adminData.isAdmin;
                } catch (e) {}

                if (isAdmin) {
                    const allRes = await fetch('/api/admin/partners');
                    const all = await allRes.json();
                    partnerData = all.find(p => p.slug === slug);
                }

                if (!partnerData) {
                    const partnerRes = await fetch('/api/user/partner');
                    if (partnerRes.ok) {
                        const myPartner = await partnerRes.json();
                        if (myPartner.slug === slug) partnerData = myPartner;
                    }
                }

                if (!partnerData) return;

                document.getElementById('editView').classList.add('visible');
                document.getElementById('edit-description').value = partnerData.description || '';
                document.getElementById('edit-website').value = partnerData.website || '';
                document.getElementById('edit-discord').value = partnerData.discord_server || '';
                document.getElementById('edit-logo').value = partnerData.logo || '';
            } catch (e) {}
        }

        async function savePartner(data) {
            let isAdmin = false;
            try {
                const adminRes = await fetch('/api/admin/check');
                isAdmin = (await adminRes.json()).isAdmin;
            } catch (e) {}

            if (isAdmin) {
                const allRes = await fetch('/api/admin/partners');
                const all = await allRes.json();
                const p = all.find(x => x.slug === slug);
                if (p) return await fetch(`/api/admin/partners/${p.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            }

            return await fetch('/api/user/partner', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }

        document.getElementById('partnerEditForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('.btn-save');
            const feedback = document.getElementById('saveFeedback');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch loading"></i> Saving...';
            feedback.style.display = 'none';

            try {
                const res = await savePartner({
                    description: document.getElementById('edit-description').value || null,
                    website: document.getElementById('edit-website').value || null,
                    discord_server: document.getElementById('edit-discord').value || null,
                    logo: document.getElementById('edit-logo').value || null
                });

                if (res.ok) {
                    feedback.textContent = 'Changes saved successfully!';
                    feedback.className = 'save-feedback success';
                    feedback.style.display = 'block';
                    loadPartnerDetail(slug);
                } else {
                    const errData = await res.json().catch(() => ({}));
                    feedback.textContent = errData.error || 'Failed to save changes.';
                    feedback.className = 'save-feedback error';
                    feedback.style.display = 'block';
                }
            } catch (err) {
                feedback.textContent = 'Failed to save changes.';
                feedback.className = 'save-feedback error';
                feedback.style.display = 'block';
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Changes';
        });
    </script>
</body>
</html>
