<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partnership | disc-tools.de</title>
    <meta name="description" content="Join our partnership program and grow together with disc-tools.de">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .partners-header {
            text-align: center;
            margin: 40px 0 60px;
        }
        .partners-header h1 {
            font-size: 48px;
            margin: 0 0 15px;
            background: linear-gradient(135deg, var(--accent), #7c8ff5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .partners-header p {
            color: var(--muted);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .partners-cta {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: var(--accent);
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .partners-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(88, 101, 242, 0.3);
        }
        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 60px 0;
        }
        .partner-card {
            background: rgba(21, 25, 33, 0.6);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .partner-card:hover {
            transform: translateY(-5px);
            border-color: rgba(88, 101, 242, 0.5);
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.1);
        }
        .partner-logo {
            width: 60px;
            height: 60px;
            background: var(--surface);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid var(--border);
        }
        .partner-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        .partner-info h3 {
            margin: 0;
            font-size: 18px;
            color: white;
        }
        .partner-info p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            flex-grow: 1;
        }
        .partner-actions {
            display: flex;
            gap: 10px;
        }
        .partner-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            background: rgba(88, 101, 242, 0.1);
            color: var(--accent);
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(88, 101, 242, 0.2);
            transition: all 0.2s;
            flex: 1;
            text-align: center;
            justify-content: center;
        }
        .partner-link:hover {
            background: var(--accent);
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-icon {
            font-size: 48px;
            color: var(--muted);
            margin-bottom: 15px;
        }
        @media (max-width: 768px) {
            .partners-header h1 { font-size: 36px; }
            .partners-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <header>
        <a href="/" class="logo-container">
            <img loading="lazy" src="/assets/img/logo.png" alt="disc-tools Logo" class="main-logo" onerror="this.style.display='none'">
            <div class="logo">disc<span>-</span>tools</div>
        </a>
        <nav class="nav-links">
            <a href="/tools/" class="nav-link">Tools</a>
            <a href="/guides/" class="nav-link">Guides</a>
            <a href="https://status.disc-tools.de/status/disc-tools" class="nav-link">Status</a>
            <a href="/partner/" class="nav-link active">Partner</a>
        </nav>
        <span class="login-badge"></span>
    </header>

    <nav class="breadcrumbs">
        <a href="/">Home</a>
        <span>/</span>
        <a href="./" class="current">Partner</a>
    </nav>

    <main class="tool-page container" style="margin-top: 0;">
        <div class="partners-header">
            <h1>Our Partners</h1>
            <p>Join a network of innovative projects and services working together to enhance the Discord ecosystem</p>
            <a href="/partner/request/" class="partners-cta"><i class="fa-solid fa-handshake"></i> Become a Partner</a>
        </div>

        <div id="partnersContainer" class="partners-grid"></div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon"><i class="fa-solid fa-star"></i></div>
            <h3>No Active Partners Yet</h3>
            <p style="color: var(--muted); margin-top: 10px;">Be the first to join our partnership program!</p>
        </div>
    </main>

    <script src="/js/umami-tracking.js"></script>
    <script>
        async function loadPartners() {
            try {
                const response = await fetch('/api/partners');
                const partners = await response.json();

                const container = document.getElementById('partnersContainer');
                const emptyState = document.getElementById('emptyState');

                if (partners.length === 0) {
                    emptyState.style.display = 'block';
                    container.style.display = 'none';
                    return;
                }

                container.innerHTML = partners.map(partner => `
                    <div class="partner-card">
                        <div style="display: flex; gap: 15px; align-items: flex-start;">
                            <div class="partner-logo">
                                ${partner.logo ? `<img src="${partner.logo}" alt="${partner.name}">` : '<i class="fa-solid fa-building"></i>'}
                            </div>
                            <div class="partner-info">
                                <h3>${partner.name}</h3>
                            </div>
                        </div>
                        <p>${partner.description}</p>
                        <div class="partner-actions">
                            ${partner.website ? `<a href="${partner.website}" target="_blank" class="partner-link"><i class="fa-solid fa-globe"></i> Website</a>` : ''}
                            ${partner.discordServer ? `<a href="${partner.discordServer}" target="_blank" class="partner-link"><i class="fa-brands fa-discord"></i> Discord</a>` : ''}
                        </div>
                    </div>
                `).join('');

                trackEvent('page_view', { page: 'partners' });
            } catch (error) {
                console.error('Failed to load partners:', error);
            }
        }

        loadPartners();
    </script>
</body>
</html>
