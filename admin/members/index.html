<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Members | Admin Dashboard | Disc-Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/assets/img/admin_logo.png">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-layout { display: flex; min-height: 100vh; background: var(--bg); }
        .admin-sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .admin-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 20px; border-bottom: 1px solid var(--border); text-decoration: none; }
        .admin-logo img { height: 32px; }
        .admin-logo span { font-family: var(--sans); font-weight: 800; font-size: 18px; color: #fff; }
        .admin-logo span span { color: #e74c3c; }
        .admin-nav { display: flex; flex-direction: column; gap: 2px; padding: 15px 10px; flex: 1; }
        .admin-nav details { display: flex; flex-direction: column; }
        .admin-nav details summary { display: flex; align-items: center; gap: 10px; padding: 10px 15px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; border-radius: 10px; user-select: none; list-style: none; transition: color 0.2s; }
        .admin-nav details summary::-webkit-details-marker { display: none; }
        .admin-nav details summary::marker { display: none; }
        .admin-nav details summary i { font-size: 12px; width: 20px; text-align: center; }
        .admin-nav details summary .arrow { margin-left: auto; font-size: 10px; transition: transform 0.2s; }
        .admin-nav details[open] summary .arrow { transform: rotate(90deg); }
        .admin-nav details summary:hover { color: #e74c3c; }
        .admin-nav details a { display: flex; align-items: center; gap: 12px; padding: 10px 15px 10px 47px; color: var(--muted); text-decoration: none; border-radius: 8px; font-weight: 500; font-size: 14px; transition: all 0.2s; }
        .admin-nav details a:hover, .admin-nav details a.active { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        .admin-nav details a i { width: 16px; text-align: center; font-size: 14px; }
        .admin-nav > a:last-child:hover { color: #e74c3c !important; text-shadow: 0 0 20px rgba(231, 76, 60, 0.5); }

        .admin-content { flex: 1; padding: 40px; overflow-y: auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .admin-header h1 { font-family: var(--sans); font-size: 28px; }

        .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; align-items: center; }
        .filter-dropdown { position: relative; }
        .filter-btn { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; border-radius: 8px; transition: all 0.2s; }
        .filter-btn:hover { border-color: #e74c3c; color: #fff; }
        .filter-btn .count { background: #e74c3c; color: #fff; padding: 1px 7px; font-size: 11px; font-weight: 700; min-width: 18px; text-align: center; border-radius: 4px; display: none; }
        .filter-menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 280px; max-height: 340px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px; z-index: 100; box-shadow: 0 12px 40px rgba(0,0,0,0.5); display: none; }
        .filter-menu.open { display: block; }
        .filter-opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; user-select: none; }
        .filter-opt:hover { background: rgba(255,255,255,0.06); }
        .filter-opt input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
        .filter-opt .dot { width: 10px; height: 10px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15); }
        .filter-opt .name { font-size: 13px; color: #fff; font-weight: 500; }
        .filter-opt .count { margin-left: auto; font-size: 11px; color: var(--muted); }
        .filter-mode { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--border); overflow: hidden; font-size: 12px; font-weight: 500; display: none; }
        .filter-mode button { padding: 6px 12px; border: none; background: transparent; color: var(--muted); cursor: pointer; border-right: 1px solid var(--border); }
        .filter-mode button:last-child { border-right: none; }
        .filter-mode button.active { background: var(--accent); color: #fff; }
        .filter-mode button:not(.active):hover { background: rgba(255,255,255,0.06); }
        .filter-badges .role-badge { display: inline-flex; align-items: center; gap: 4px; margin: 0; }
        .filter-badges .role-badge .remove { font-size: 10px; opacity: 0.6; cursor: pointer; padding: 0 2px; }
        .filter-badges .role-badge .remove:hover { opacity: 1; }
        .filter-clear { font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 10px; border: 1px solid var(--border); background: transparent; white-space: nowrap; }
        .filter-clear:hover { color: #e74c3c; border-color: #e74c3c; }
        .member-count { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
        .action-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 500; border-radius: 8px; transition: all 0.2s; }
        .action-btn:hover { background: #e74c3c; color: #fff; border-color: #e74c3c; }

        .table-wrapper { border-radius: 12px; border: 1px solid var(--border); }
        .members-table { width: 100%; border-collapse: collapse; background: var(--surface); table-layout: fixed; border: none; }
        .members-table th, .members-table td { padding: 14px 18px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
        .members-table td { border-right: 1px solid rgba(255,255,255,0.08); }
        .members-table td:last-child { border-right: none; }
        .members-table tbody td:nth-child(2) { background: rgba(255,255,255,0.02); }
        .members-table th { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; letter-spacing: 0.05em; background: rgba(0,0,0,0.2); }
        .members-table th:first-child { width: 35%; }
        .members-table th:nth-child(2) { width: 45%; }
        .members-table th:nth-child(3) { width: 20%; }
        .members-table tr:last-child td { border-bottom: none; }

        .member-avatar { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; }
        .member-name { font-weight: 600; color: #fff; font-size: 14px; }
        .member-id { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }

        .member-cell { display: flex; align-items: center; gap: 14px; width: 100%; }
        .member-cell > div:last-child { flex: 1; min-width: 0; }

        .role-badge { display: inline-block; padding: 2px 9px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; margin-right: 5px; margin-bottom: 3px; cursor: pointer; }
        .role-badge.active-filter { outline: 2px solid #fff; outline-offset: 2px; }
        .member-row td { background: transparent; }
        .member-row td:last-child { white-space: nowrap; }

        .role-group-header { cursor: pointer; user-select: none; }
        .role-group-header td { padding: 10px 18px; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #fff; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); }
        .role-group-header .group-count { font-weight: 400; font-size: 11px; text-transform: none; letter-spacing: 0; opacity: 0.6; margin-left: 8px; }
        .role-group-header .group-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; vertical-align: middle; }
        .role-group-header .group-arrow { float: right; font-size: 12px; opacity: 0.5; }
        .role-group-header.collapsed .group-arrow { transform: rotate(-90deg); }
        .member-row.hidden-by-collapse { display: none; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="/" class="admin-logo"><img src="/assets/img/admin_logo.png" alt="Logo"><span>Disc<span>-</span>Tools</span></a>
            <nav class="admin-nav">
                <details open>
                    <summary><i class="fa-solid fa-layer-group"></i> General <span class="arrow">&#9654;</span></summary>
                    <a href="/admin/overview/"><i class="fa-solid fa-house"></i> Overview</a>
                    <a href="/admin/linktree/"><i class="fa-solid fa-link"></i> Linktree Profile</a>
                    <a href="/admin/members/" class="active"><i class="fa-solid fa-users"></i> Members</a>
                    <a href="/admin/tools/"><i class="fa-solid fa-wrench"></i> Tools</a>
                    <a href="/admin/announcements/"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
                </details>
                <details open>
                    <summary><i class="fa-solid fa-server"></i> System <span class="arrow">&#9654;</span></summary>
                    <a href="/admin/logs/"><i class="fa-solid fa-file-lines"></i> Logs</a>
                    <a href="/admin/system/"><i class="fa-solid fa-server"></i> System</a>
                </details>
                <details open>
                    <summary><i class="fa-solid fa-handshake"></i> Partnerships <span class="arrow">&#9654;</span></summary>
                    <a href="/admin/partner/"><i class="fa-solid fa-handshake"></i> Manage Partners</a>
                    <a href="/admin/partner/requests/"><i class="fa-solid fa-inbox"></i> Partnership Requests</a>
                </details>
                <details open>
                    <summary><i class="fa-solid fa-cube"></i> Other Services <span class="arrow">&#9654;</span></summary>
                    <a href="https://mail.disc-tools.de/mail/" target="_blank"><i class="fa-solid fa-envelope"></i> Mail</a>
                    <a href="https://mail.disc-tools.de/iredadmin" target="_blank"><i class="fa-solid fa-user-shield"></i> Admin mail</a>
                    <a href="https://umami.disc-tools.de" target="_blank"><i class="fa-solid fa-chart-line"></i> Umami</a>
                    <a href="https://status.disc-tools.de/status/disc-tools" target="_blank"><i class="fa-solid fa-circle-check"></i> Status</a>
                </details>
                <a href="/" style="margin-top: auto; color: var(--muted); display: flex; align-items: center; gap: 12px; padding: 12px 15px; text-decoration: none; border-radius: 10px; font-weight: 500; font-size: 14px; transition: all 0.2s;"><i class="fa-solid fa-right-from-bracket"></i> Exit Admin</a>
            </nav>
        </aside>

        <main class="admin-content">
            <header class="admin-header">
                <div>
                    <h1>Manage Members</h1>
                    <p style="color: var(--muted); margin-top: 5px;">Guild Members (Max 50 loaded)</p>
                </div>
                <button class="action-btn" onclick="loadMembers()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
            </header>

            <div class="filter-bar" id="filter-bar">
                <div class="filter-dropdown" id="filter-dropdown">
                    <button class="filter-btn" onclick="toggleDropdown()">
                        <i class="fa-solid fa-filter"></i> Filter by Role
                        <span class="count" id="filter-count">0</span>
                        <i class="fa-solid fa-chevron-down" style="font-size:10px"></i>
                    </button>
                    <div class="filter-menu" id="filter-menu"></div>
                </div>
                <div class="filter-mode" id="filter-mode">
                    <button class="active" onclick="setFilterMode('any')" id="mode-any">Any</button>
                    <button onclick="setFilterMode('all')" id="mode-all">All</button>
                </div>
                <div class="filter-badges" id="filter-badges"></div>
            </div>

            <div class="member-count" id="member-count"></div>

            <div class="table-wrapper">
            <table class="members-table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Roles</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="members-list">
                    <tr><td colspan="3" style="text-align: center; color: var(--muted); padding: 40px;">Loading members...</td></tr>
                </tbody>
            </table>
            </div>
        </main>
    </div>

    <script>
        let allMembers = [];
        let allRoles = [];
        let activeFilters = [];
        let filterMode = 'any';

        document.querySelectorAll('.admin-nav details').forEach(d => {
            const key = 'nav-' + d.querySelector('summary').textContent.trim().toLowerCase().replace(/\s+/g, '-');
            const saved = localStorage.getItem(key);
            if (saved !== null) d.open = saved === 'true';
            d.addEventListener('toggle', () => { localStorage.setItem(key, d.open); });
        });

        let collapsedRoles = {};

        function loadCollapsedState() {
            try {
                const saved = localStorage.getItem('admin_members_collapsed');
                collapsedRoles = saved ? JSON.parse(saved) : {};
            } catch (e) { collapsedRoles = {}; }
        }

        function saveCollapsedState() {
            try { localStorage.setItem('admin_members_collapsed', JSON.stringify(collapsedRoles)); } catch (e) {}
        }

        function applyCollapseState(roleId) {
            const rows = document.querySelectorAll('#members-list tr');
            let found = false;
            rows.forEach(row => {
                if (row.classList.contains('role-group-header') && row.dataset.roleId === roleId) {
                    found = true;
                    row.classList.toggle('collapsed', !!collapsedRoles[roleId]);
                } else if (found && row.classList.contains('role-group-header')) {
                    found = false;
                } else if (found && row.classList.contains('member-row')) {
                    row.classList.toggle('hidden-by-collapse', !!collapsedRoles[roleId]);
                }
            });
        }

        document.getElementById('members-list').addEventListener('click', (e) => {
            const header = e.target.closest('.role-group-header');
            if (!header) return;
            const roleId = header.dataset.roleId;
            collapsedRoles[roleId] = !collapsedRoles[roleId];
            saveCollapsedState();
            applyCollapseState(roleId);
        });

        function getHighestRole(member) {
            return (member.enrichedRoles && member.enrichedRoles.length > 0) ? member.enrichedRoles[0] : null;
        }

        function roleColor(role) {
            return (!role.color || role.color === 0) ? null : '#' + role.color.toString(16).padStart(6, '0');
        }

        function getRole(id) { return allRoles.find(r => r.id === id); }
        function isFiltered(roleId) { return activeFilters.includes(roleId); }

        function toggleDropdown() { document.getElementById('filter-menu').classList.toggle('open'); }

        document.addEventListener('click', function(e) {
            const dd = document.getElementById('filter-dropdown');
            if (!dd.contains(e.target)) document.getElementById('filter-menu').classList.remove('open');
        });

        function toggleFilter(roleId) {
            const idx = activeFilters.indexOf(roleId);
            if (idx >= 0) activeFilters.splice(idx, 1); else activeFilters.push(roleId);
            renderFilterBar();
            renderMembers();
        }

        function clearFilters() { activeFilters = []; renderFilterBar(); renderMembers(); }

        function setFilterMode(mode) {
            filterMode = mode;
            document.getElementById('mode-any').className = mode === 'any' ? 'active' : '';
            document.getElementById('mode-all').className = mode === 'all' ? 'active' : '';
            renderMembers();
        }

        function renderFilterBar() {
            const menu = document.getElementById('filter-menu');
            const badges = document.getElementById('filter-badges');
            const countEl = document.getElementById('filter-count');
            const modeToggle = document.getElementById('filter-mode');

            let menuHtml = '';
            allRoles.forEach(r => {
                const color = roleColor(r);
                const checked = isFiltered(r.id) ? 'checked' : '';
                const dotStyle = color ? 'background:' + color : 'background:rgba(255,255,255,0.15)';
                const memberCount = allMembers.filter(m => m.roles && m.roles.includes(r.id)).length;
                menuHtml += '<label class="filter-opt"><input type="checkbox" ' + checked + ' onchange="toggleFilter(\'' + r.id + '\')"><span class="dot" style="' + dotStyle + '"></span><span class="name">' + r.name + '</span><span class="count">' + memberCount + '</span></label>';
            });
            menu.innerHTML = menuHtml;
            modeToggle.style.display = activeFilters.length >= 2 ? 'inline-flex' : 'none';

            let badgesHtml = '';
            activeFilters.forEach(function(id) {
                const r = getRole(id);
                if (!r) return;
                const color = roleColor(r);
                const style = color ? 'background:' + color + '22; border-color:' + color + '88; color:' + color : '';
                badgesHtml += '<span class="role-badge" style="' + style + '">' + r.name + '<span class="remove" onclick="event.stopPropagation();toggleFilter(\'' + r.id + '\')">\u2715</span></span>';
            });
            if (activeFilters.length > 0) badgesHtml += '<button class="filter-clear" onclick="clearFilters()">Clear all</button>';
            badges.innerHTML = badgesHtml;

            if (activeFilters.length > 0) { countEl.style.display = 'inline'; countEl.textContent = activeFilters.length; }
            else { countEl.style.display = 'none'; }
        }

        function renderMembers() {
            const list = document.getElementById('members-list');
            const countEl = document.getElementById('member-count');

            const filtered = activeFilters.length > 0
                ? allMembers.filter(m => m.roles && (filterMode === 'all' ? activeFilters.every(function(fid) { return m.roles.indexOf(fid) >= 0; }) : activeFilters.some(function(fid) { return m.roles.indexOf(fid) >= 0; })))
                : allMembers;

            countEl.textContent = 'Showing ' + filtered.length + ' of ' + allMembers.length + ' members';

            const groups = {};
            const noRoleMembers = [];
            filtered.forEach(function(m) {
                if (!m.user) return;
                const highest = getHighestRole(m);
                if (highest) { var key = highest.id; if (!groups[key]) groups[key] = { role: highest, members: [] }; groups[key].members.push(m); }
                else { noRoleMembers.push(m); }
            });

            const sortedKeys = Object.keys(groups).sort(function(a, b) { return groups[b].role.position - groups[a].role.position; });
            list.innerHTML = '';
            var rowCount = 0;

            function createGroupHeader(role, members) {
                const tr = document.createElement('tr');
                tr.className = 'role-group-header';
                tr.dataset.roleId = role.id;
                const td = document.createElement('td');
                td.colSpan = 3;
                const dot = document.createElement('span');
                dot.className = 'group-dot';
                const color = roleColor(role);
                dot.style.background = color || 'rgba(255,255,255,0.15)';
                td.appendChild(dot);
                td.appendChild(document.createTextNode(role.name));
                const cnt = document.createElement('span');
                cnt.className = 'group-count';
                cnt.textContent = members.length + ' member' + (members.length !== 1 ? 's' : '');
                td.appendChild(cnt);
                const arrow = document.createElement('span');
                arrow.className = 'group-arrow';
                const icon = document.createElement('i');
                icon.className = 'fa-solid fa-chevron-down';
                arrow.appendChild(icon);
                td.appendChild(arrow);
                tr.appendChild(td);
                return tr;
            }

            function createMemberRow(m) {
                if (!m.user) return null;
                const tr = document.createElement('tr');
                tr.className = 'member-row';
                const isGif = m.user.avatar && m.user.avatar.startsWith('a_');
                const ext = isGif ? '.gif' : '.png';
                let avatarUrl = 'https://cdn.discordapp.com/embed/avatars/' + ((m.user.discriminator || 0) % 5) + '.png';
                if (m.user.avatar) avatarUrl = 'https://cdn.discordapp.com/avatars/' + m.user.id + '/' + m.user.avatar + ext + '?size=64';

                const td1 = document.createElement('td');
                const cell = document.createElement('div');
                cell.className = 'member-cell';
                const img = document.createElement('img');
                img.className = 'member-avatar';
                img.alt = '';
                img.src = avatarUrl;
                const info = document.createElement('div');
                const nameDiv = document.createElement('div');
                nameDiv.className = 'member-name';
                nameDiv.textContent = m.user.username;
                const idDiv = document.createElement('div');
                idDiv.className = 'member-id';
                idDiv.textContent = m.user.id;
                info.appendChild(nameDiv); info.appendChild(idDiv);
                cell.appendChild(img); cell.appendChild(info);
                td1.appendChild(cell);
                tr.appendChild(td1);

                const td2 = document.createElement('td');
                if (m.enrichedRoles) {
                    m.enrichedRoles.forEach(function(r) {
                        const span = document.createElement('span');
                        span.className = 'role-badge' + (isFiltered(r.id) ? ' active-filter' : '');
                        const c = roleColor(r);
                        if (c) { span.style.background = c + '22'; span.style.borderColor = c + '88'; span.style.color = c; }
                        span.textContent = r.name;
                        span.addEventListener('click', function() { toggleFilter(r.id); });
                        td2.appendChild(span);
                    });
                } else {
                    m.roles.forEach(function(rid) {
                        const span = document.createElement('span');
                        span.className = 'role-badge';
                        span.textContent = rid.slice(0, 6) + '\u2026';
                        span.addEventListener('click', function() { toggleFilter(rid); });
                        td2.appendChild(span);
                    });
                }
                tr.appendChild(td2);

                const td3 = document.createElement('td');
                const kickBtn = document.createElement('button');
                kickBtn.className = 'action-btn';
                kickBtn.textContent = 'Kick';
                kickBtn.addEventListener('click', function() { kick(m.user.id, m.user.username); });
                td3.appendChild(kickBtn);
                td3.appendChild(document.createTextNode(' '));
                const banBtn = document.createElement('button');
                banBtn.className = 'action-btn';
                banBtn.textContent = 'Ban';
                banBtn.addEventListener('click', function() { ban(m.user.id, m.user.username); });
                td3.appendChild(banBtn);
                tr.appendChild(td3);

                return tr;
            }

            sortedKeys.forEach(function(key) {
                const group = groups[key];
                list.appendChild(createGroupHeader(group.role, group.members));
                group.members.forEach(function(m) {
                    var row = createMemberRow(m);
                    if (row) { list.appendChild(row); rowCount++; }
                });
            });

            if (noRoleMembers.length > 0) {
                list.appendChild(createGroupHeader({ id: '__none__', name: 'No Role', position: -1, color: 0 }, noRoleMembers));
                noRoleMembers.forEach(function(m) {
                    var row = createMemberRow(m);
                    if (row) { list.appendChild(row); rowCount++; }
                });
            }

            if (rowCount === 0 && allMembers.length === 0) {
                list.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--muted); padding: 40px;">No members loaded.</td></tr>';
            } else if (rowCount === 0 && activeFilters.length > 0) {
                var modeText = filterMode === 'all' ? 'all selected roles' : 'any selected role';
                list.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--muted); padding: 40px;">No members match <strong>' + modeText + '</strong>.</td></tr>';
            }

            Object.keys(collapsedRoles).forEach(function(roleId) {
                applyCollapseState(roleId);
            });
        }

        async function loadMembers() {
            const list = document.getElementById('members-list');
            try {
                const res = await fetch('/api/admin/members');
                if (!res.ok) { window.location.href = '/'; return; }
                const data = await res.json();
                if (Array.isArray(data)) { allMembers = data; allRoles = []; }
                else { allMembers = data.members || []; allRoles = data.roles || []; }
                renderFilterBar();
                renderMembers();
            } catch (e) {
                list.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:40px">Error loading members</td></tr>';
            }
        }

        function kick(id, name) {
            const reason = prompt('Reason for kicking ' + name + ':');
            if (reason === null) return;
            if (!confirm('Kick ' + name + '?\nReason: ' + (reason || '(none)'))) return;
            fetch('/api/admin/members/' + id + '/kick', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: reason || 'No reason provided.' }) })
                .then(function(r) { return r.json(); }).then(function(d) { if (d.success) { alert('Kicked ' + name); loadMembers(); } else { alert('Failed: ' + (d.error || 'Unknown error')); } })
                .catch(function(e) { alert('Error: ' + e.message); });
        }

        function ban(id, name) {
            const reason = prompt('Reason for banning ' + name + ':');
            if (reason === null) return;
            if (!confirm('Ban ' + name + '?\nReason: ' + (reason || '(none)'))) return;
            fetch('/api/admin/members/' + id + '/ban', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: reason || 'No reason provided.' }) })
                .then(function(r) { return r.json(); }).then(function(d) { if (d.success) { alert('Banned ' + name); loadMembers(); } else { alert('Failed: ' + (d.error || 'Unknown error')); } })
                .catch(function(e) { alert('Error: ' + e.message); });
        }

        loadCollapsedState();
        loadMembers();
    </script>
</body>
</html>
