<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools | Admin Dashboard | Disc-Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/assets/img/admin_logo.png">
    <link rel="stylesheet" href="/css/style.css">
        <style>
        .admin-layout { display: flex; min-height: 100vh; background: var(--bg); }
        .admin-sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .admin-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px 20px; border-bottom: 1px solid var(--border); text-decoration: none; }
        .admin-logo img { height: 32px; }
        .admin-logo span { font-family: var(--sans); font-weight: 800; font-size: 18px; color: #fff; }
        .admin-logo span span { color: #e74c3c; }
        .admin-nav { display: flex; flex-direction: column; gap: 2px; padding: 15px 10px; flex: 1; }
        .admin-nav details { display: flex; flex-direction: column; }
        .admin-nav details summary { display: flex; align-items: center; gap: 10px; padding: 10px 15px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; border-radius: 10px; user-select: none; list-style: none; transition: color 0.2s; }
        .admin-nav details summary::-webkit-details-marker { display: none; }
        .admin-nav details summary::marker { display: none; }
        .admin-nav details summary i { font-size: 12px; width: 20px; text-align: center; }
        .admin-nav details summary .arrow { margin-left: auto; font-size: 10px; transition: transform 0.2s; }
        .admin-nav details[open] summary .arrow { transform: rotate(90deg); }
        .admin-nav details summary:hover { color: #e74c3c; }
        .admin-nav details a { display: flex; align-items: center; gap: 12px; padding: 10px 15px 10px 47px; color: var(--muted); text-decoration: none; border-radius: 8px; font-weight: 500; font-size: 14px; transition: all 0.2s; }
        .admin-nav details a:hover, .admin-nav details a.active { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        .admin-nav details a i { width: 16px; text-align: center; font-size: 14px; }

        .admin-content { flex: 1; padding: 40px; overflow-y: auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .admin-header h1 { font-family: var(--sans); font-size: 28px; }

        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .tool-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 20px; display: flex; align-items: center; gap: 15px; }
        .tool-icon { width: 45px; height: 45px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
        .tool-info { flex: 1; }
        .tool-name { font-weight: 600; font-size: 15px; color: #fff; }
        .tool-stats { font-size: 12px; color: var(--muted); margin-top: 5px; }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: var(--muted); transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2ecc71; }
        input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }
        .admin-nav > a:last-child:hover { color: #e74c3c !important; text-shadow: 0 0 20px rgba(231, 76, 60, 0.5); }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="/" class="admin-logo"><img src="/assets/img/admin_logo.png" alt="Logo"><span>Disc<span>-</span>Tools</span></a>
            <nav class="admin-nav">
                <details open>
                    <summary><i class="fa-solid fa-layer-group"></i> General <span class="arrow">&#9654;</span></summary>
                    <a href="/admin/overview/"><i class="fa-solid fa-house"></i> Overview</a>
                    <a href="/admin/linktree/"><i class="fa-solid fa-link"></i> Linktree Profile</a>
                    <a href="/admin/members/"><i class="fa-solid fa-users"></i> Members</a>
                    <a href="/admin/tools/" class="active"><i class="fa-solid fa-wrench"></i> Tools</a>
                    <a href="/admin/announcements/"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
                </details>
                <details open>
                    <summary><i class="fa-solid fa-server"></i> System <span class="arrow">&#9654;</span></summary>
                    <a href="/admin/logs/"><i class="fa-solid fa-file-lines"></i> Logs</a>
                    <a href="/admin/system/"><i class="fa-solid fa-server"></i> System</a>
                </details>
                <details open>
                    <summary><i class="fa-solid fa-handshake"></i> Partnerships <span class="arrow">&#9654;</span></summary>
                    <a href="/admin/partner/"><i class="fa-solid fa-handshake"></i> Manage Partners</a>
                    <a href="/admin/partner/requests/"><i class="fa-solid fa-inbox"></i> Partnership Requests</a>
                </details>
                <details open>
                    <summary><i class="fa-solid fa-cube"></i> Other Services <span class="arrow">&#9654;</span></summary>
                    <a href="https://mail.disc-tools.de/mail/" target="_blank"><i class="fa-solid fa-envelope"></i> Mail</a>
                    <a href="https://mail.disc-tools.de/iredadmin" target="_blank"><i class="fa-solid fa-user-shield"></i> Admin mail</a>
                    <a href="https://umami.disc-tools.de" target="_blank"><i class="fa-solid fa-chart-line"></i> Umami</a>
                    <a href="https://status.disc-tools.de/status/disc-tools" target="_blank"><i class="fa-solid fa-circle-check"></i> Status</a>
                </details>
                <a href="/" style="margin-top: auto; color: var(--muted); display: flex; align-items: center; gap: 12px; padding: 12px 15px; text-decoration: none; border-radius: 10px; font-weight: 500; font-size: 14px; transition: all 0.2s;"><i class="fa-solid fa-right-from-bracket"></i> Exit Admin</a>
            </nav>
        </aside>

        <main class="admin-content">
            <header class="admin-header">
                <div>
                    <h1>Manage Tools</h1>
                    <p style="color: var(--muted); margin-top: 5px;">Toggle 'Coming Soon' status and view stats.</p>
                </div>
            </header>

            <div class="tools-grid" id="toolsGrid"></div>
        </main>
    </div>

    <script>
        async function checkAuth() {
            try {
                const res = await fetch('/api/admin/check');
                if (!res.ok) window.location.href = '/';
            } catch (e) { window.location.href = '/'; }
        }
        checkAuth();

        // Sidebar collapse state persistence
        document.querySelectorAll('.admin-nav details').forEach(d => {
            const key = 'nav-' + d.querySelector('summary').textContent.trim().toLowerCase().replace(/\s+/g, '-');
            const saved = localStorage.getItem(key);
            if (saved !== null) d.open = saved === 'true';
            d.addEventListener('toggle', () => {
                localStorage.setItem(key, d.open);
            });
        });

        function createToolPanel(tool) {
            const panel = document.createElement('div');
            panel.className = 'tool-panel';
            panel.dataset.tool = tool.id;
            const activeClass = tool.active ? '' : ' style="color: #e74c3c;"';
            panel.innerHTML = ''
                + '<div class="tool-icon" style="color: ' + tool.color + ';"><i class="' + tool.icon + '"></i></div>'
                + '<div class="tool-info">'
                + '<div class="tool-name">' + tool.name + '</div>'
                + '<div class="tool-stats"' + (tool.active ? '' : ' style="color: #e74c3c;"') + '>'
                + (tool.active ? 'Active • ' + (tool.view_count || 0).toLocaleString() + ' views' : 'Coming Soon')
                + '</div>'
                + '</div>'
                + '<label class="switch"><input type="checkbox"' + (tool.active ? ' checked' : '') + '><span class="slider"></span></label>';
            return panel;
        }

        async function loadTools() {
            try {
                const res = await fetch('/api/admin/tools');
                if (!res.ok) return;
                const tools = await res.json();
                const grid = document.getElementById('toolsGrid');
                grid.innerHTML = '';
                tools.forEach(tool => {
                    grid.appendChild(createToolPanel(tool));
                });
            } catch (e) {
                console.error('Failed to load tools:', e);
            }
        }

        document.getElementById('toolsGrid').addEventListener('change', async (e) => {
            if (e.target.type !== 'checkbox') return;
            const panel = e.target.closest('.tool-panel');
            if (!panel) return;
            const toolId = panel.dataset.tool;
            const checkbox = e.target;
            try {
                const res = await fetch('/api/admin/tools/' + toolId + '/toggle', { method: 'POST' });
                if (res.ok) {
                    const tool = await res.json();
                    const newPanel = createToolPanel(tool);
                    panel.replaceWith(newPanel);
                } else {
                    checkbox.checked = !checkbox.checked;
                }
            } catch {
                checkbox.checked = !checkbox.checked;
            }
        });

        loadTools();
    </script>
</body>
</html>
