<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Disc-Tools</title>
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css">
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <link rel="stylesheet" href="/css/style.css?v=2">
        <style>
        body { display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; }
        .admin-login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.3s ease forwards;
        }
        .admin-icon {
            width: 80px; height: 80px;
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }
        .admin-login-card h1 { font-family: var(--sans); font-size: 24px; margin-bottom: 10px; }
        .admin-login-card p { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 30px; }
        .btn-continue {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%;
            background: #e74c3c; color: #fff;
            padding: 12px; border-radius: 10px;
            font-weight: 600; text-decoration: none;
            transition: all 0.2s; border: none; cursor: pointer;
        }
        .btn-continue:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3); }
        .btn-cancel {
            display: inline-block; margin-top: 15px;
            color: var(--muted); font-size: 13px; text-decoration: none;
        }
        .btn-cancel:hover { color: #fff; }
    </style>
    <script defer src="https://umami.disc-tools.de/script.js" data-website-id="0cf82497-80c8-42a2-b6e4-8a8ae179d1fe"></script>
    <meta property="og:image" content="https://disc-tools.de/assets/img/logo.png">
    <meta property="og:image:width" content="64">
    <meta property="og:image:height" content="64">
    <meta name="twitter:image" content="https://disc-tools.de/assets/img/logo.png">
</head>
<body>
    <div class="glow"></div>
    <div class="admin-login-card">
        <div class="admin-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h1>Admin Dashboard</h1>
        <p>You are about to enter the restricted Admin Dashboard. Server-side validation will verify your roles.</p>
        <button class="btn-continue" onclick="verifyAdmin()"><i class="fa-solid fa-right-to-bracket"></i> Continue</button>
        <a href="/" class="btn-cancel">Return to Home</a>
    </div>

    <script>
        async function verifyAdmin() {
            const btn = document.querySelector('.btn-continue');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin/check');
                if (res.ok) {
                    window.location.href = '/admin/overview/';
                } else {
                    alert('Access Denied. You do not have the required Discord roles.');
                    window.location.href = '/';
                }
            } catch (e) {
                alert('Verification failed.');
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
