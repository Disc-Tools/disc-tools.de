name: Assign new issues
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  assign:
    if: github.event.issue.assignees[0] == null
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign to maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-assignee mistr-kebab
