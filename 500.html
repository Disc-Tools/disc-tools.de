<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500 | Disc-Tools</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0d13">

    <link rel="icon" type="image/png" href="/static/assets/img/logo.png">
    <link rel="apple-touch-icon" href="/static/assets/img/logo.png">

    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/fa-icons/fa.min.css">

    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .err-box { padding: 48px 32px; }
        .err-box .code { font-family: var(--font-display); font-size: clamp(5rem, 12vw, 8rem); font-weight: 700; color: #f04747; line-height: 1; margin-bottom: 8px; }
        .err-box h1 { font-size: clamp(1.2rem, 3vw, 1.6rem); margin-bottom: 8px; }
        .err-box p { color: var(--text-muted); font-size: 15px; max-width: 42ch; margin: 0 auto 28px; }
        .err-box .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .err-box .links a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 20px; border: 1px solid var(--border); border-radius: 12px; color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px; transition: border-color 0.15s, background 0.15s; }
        .err-box .links a:hover { border-color: var(--blurple); background: rgba(88,101,242,0.08); }
        .err-box .links a.primary { background: var(--blurple); border-color: var(--blurple); color: #fff; }
        .err-box .links a.primary:hover { background: var(--blurple-strong); }
    </style>
</head>
<body>
    <div class="err-box">
        <div class="code">500</div>
        <h1>Internal server error</h1>
        <p>Something went wrong on our end. We are aware and working on it.</p>
        <div class="links">
            <a href="/" class="primary"><i class="fa-solid fa-house"></i> Home</a>
            <a href="javascript:location.reload()"><i class="fa-solid fa-rotate-right"></i> Retry</a>
        </div>
    </div>
<script defer src="https://umami.disc-tools.de/script.js" data-website-id="0cf82497-80c8-42a2-b6e4-8a8ae179d1fe"></script>
</body>
</html>
